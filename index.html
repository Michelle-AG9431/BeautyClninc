<script>
/* ══════════════════════════════════════════════════════════════
   0. 設定與全域狀態
   ══════════════════════════════════════════════════════════════ */

// ★ 在這裡貼上你的 Apps Script URL（空字串 = 使用內建價格）
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwisIQTEa5jyNXXybpKP8VbG9mIfOwj21Yu-qlMdFNvYaWq4B4k8y9AbTeZxQ0fQg3OrQ/exec';

// 可被 Sheet 覆蓋的費率
const rates = {
  bnls:   {r1:3030, r2:1980},
  sansam: {r1:8000, r2:7000, r3:6000},
  fatx:   {r1:8000, r2:7000, r3:6000},
  areas:  {r:980},
  jalu26: {unit:55000, glow:6000}
};

// 支/瓶計算項目的單位價格（Sheet 更新時會同步）
const unitPrices = {
  's1t21':30350, 's1t22':35350, 's1t23':35350, 's1t45':17500,
  's1t27':105000,
  's1t28':54800, 's1t29':56000, 's1t30':120000,
  's1t32':34800, 's1t33':45000,
  's1t34':57200, 's1t35':57200, 's1t36':57200, 's1t37':66000,
  's1t38':81270,
  's1t54':88000, 's1t55':88000,
  's1t57':48000,
};

// 固定價格項目
const staticPrices = {
  's4t0':81000,'s4t1':121500,'s4t2':81000,'s4t3':81000,
  's4t4':162000,'s4t5':135000,'s4t6':27000,'s4t7':218160,
  's4t8':218160,'s4t9':218160,'s4t10':181494,'s4t11':181494,
  's0t20':7800,'s0t23':7840
};

// 選取狀態
const P = {}, O = {}, C = new Set();
let rate = 0.2004;

// 當月優惠
let dealsData       = {};   // 核心項目優惠（key 可用 __id__ 指向元素）
let extraDealsData  = {};   // extra_items 優惠
let dealModeOn      = false;
let groupDeals      = {};   // 群組折扣：unit / select / buddy
let dealsById       = {};   // 元素ID → [{key, deal}]（同一項目可有多筆優惠）
let extraGroups     = {};   // extra_items 的「同時優惠」群組

// 分院篩選
let clinicMap     = {};
let currentClinic = 'all';

// 整組同價的藥丸項目（m_val1 / l_val2 這類優惠套用後要重算的函式）
const GROUP_PILL_RECOMPUTE = {
  's2t6':   'ondaBodyU',      // Onda 身體
  's0t31b': 'morpheusBodyU',  // 墨菲斯 身體
};


/* ══════════════════════════════════════════════════════════════
   1. 當月優惠：索引・徽章・開關
   ══════════════════════════════════════════════════════════════ */

function indexDealsById(){
  dealsById = {};
  Object.entries(dealsData).forEach(([key, deal]) => {
    const eid = deal['__id__'] || key;
    if (!dealsById[eid]) dealsById[eid] = [];
    dealsById[eid].push({ key, deal });
  });
}

function getDealsForElement(id){ return dealsById[id] || []; }

// 純 buddy 行（本身沒有自己的優惠）不顯示徽章
function removePureBuddyBadges(){
  Object.entries(dealsData).forEach(([key, deal]) => {
    const hasOwnDeal = Object.keys(deal).some(k => !k.startsWith('__') && k !== 'buddy');
    if (deal['buddy'] !== undefined && !hasOwnDeal) {
      const el = document.getElementById(deal['__id__'] || key);
      const badge = el && el.querySelector('.deal-badge');
      if (badge) badge.remove();
    }
  });
}

// 同一項目可能跨多個群組，統一決定 deal-on 樣式
function syncDealOnClass(id){
  const el = document.getElementById(id);
  if (!el) return;
  let any = false;
  Object.values(groupDeals).forEach(g => {
    if ((g.type !== 'select' && g.type !== 'unit') || !g.items || !g.items[id]) return;
    const checkedCount = Object.keys(g.items).filter(iid => C.has(iid)).length;
    if (C.has(id) && checkedCount >= g.trigger) any = true;
  });
  el.classList.toggle('deal-on', any);
}

// 標記有優惠的項目（加上紅色 badge）
function applyDealBadges(){
  indexDealsById();

  // 核心項目
  Object.keys(dealsById).forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.querySelector('.deal-badge')) return;
    const tn = el.querySelector('.tn');
    if (!tn) return;
    const note = dealsById[id].map(e => e.deal['__note__']).filter(Boolean)[0] || '優惠';
    const badge = document.createElement('span');
    badge.className = 'deal-badge';
    badge.textContent = note;
    const noteEl = tn.querySelector('.note');
    if (noteEl) tn.insertBefore(badge, noteEl); else tn.appendChild(badge);
    el.classList.add('has-deal');
  });

  // extra_items（用「名稱＋類別」對應）
  Object.entries(extraDealsData).forEach(([extraKey, deal]) => {
    const name = deal['__name__'] || extraKey, cat = deal['__cat__'] || '';
    let el = null;
    document.querySelectorAll('[data-name="' + name + '"]').forEach(c => {
      if (el) return;
      if (!cat) { el = c; return; }
      const catEl = c.closest('.cat') || (c.parentElement && c.parentElement.closest('.cat'));
      const catTitle = (catEl && catEl.querySelector('.ctit') ? catEl.querySelector('.ctit').textContent.trim() : '');
      if (catTitle.includes(cat) || cat.includes(catTitle)) el = c;
    });
    if (!el || el.querySelector('.deal-badge')) return;
    const tn = el.querySelector('.tn');
    if (!tn) return;
    const badge = document.createElement('span');
    badge.className = 'deal-badge';
    badge.textContent = deal['__note__'] || '優惠';
    const note = tn.querySelector('.note');
    if (note) tn.insertBefore(badge, note); else tn.appendChild(badge);
    el.classList.add('has-deal');
    el.dataset.extraDealKey = extraKey;
  });
}

// 切換「當月優惠價」
function toggleDeals(on){
  dealModeOn = on;
  indexDealsById();

  // 核心項目（同一元素多筆優惠全部套用）
  Object.entries(dealsById).forEach(([id, entries]) => {
    const el = document.getElementById(id);
    entries.forEach(({deal}) => applyDealToEl(el, id, deal, on));
  });

  // extra_items
  document.querySelectorAll('[data-extra-deal-key]').forEach(el => {
    const deal = extraDealsData[el.dataset.extraDealKey];
    if (deal) applyDealToEl(el, el.id, deal, on);
  });

  if (!on) document.querySelectorAll('.qty-deal-hint').forEach(h => h.style.display = 'none');

  Object.keys(groupDeals).forEach(gid => {
    if (groupDeals[gid].type === 'select') refreshSelectGroup(gid);
    if (groupDeals[gid].type === 'buddy')  refreshBuddyGroup(gid);
  });
  refreshExtraGroups();
}

// 建立群組折扣對照表（unit / select / buddy 三種）
function buildGroupDeals(){
  groupDeals = {};
  const groupMembers = {};
  Object.entries(dealsData).forEach(([key, deal]) => {
    if (!deal['__group__']) return;
    const gid = deal['__group__'];
    const id  = deal['__id__'] || key;
    if (!groupMembers[gid]) groupMembers[gid] = [];
    groupMembers[gid].push({ id, deal });
  });

  Object.entries(groupMembers).forEach(([gid, members]) => {
    const buddyMembers     = members.filter(m => m.deal['buddy'] !== undefined);
    const buddyUnitMembers = members.filter(m => m.deal['buddy_unit'] !== undefined);

    if (buddyMembers.length > 0 && buddyUnitMembers.length > 0) {
      // ── buddy（搭配同打）群組 ──
      const primary = buddyUnitMembers[0];
      groupDeals[gid] = {
        type: 'buddy',
        trigger: primary.deal['__trigger__'] || 2,
        primary: {
          id: primary.id,
          dealUnit: primary.deal['buddy_unit'],
          normalUnit: unitPrices[primary.id] || 0,
          priceElId: 'p' + primary.id,
          note: primary.deal['__note__'] || '搭配優惠',
        },
        buddies: buddyMembers.map(b => b.id),
      };
      return;
    }

    // ── 支數（unit）群組 ──
    const unitMembers = members.filter(m => m.deal['unit'] !== undefined);
    if (unitMembers.length > 0 && unitMembers[0].deal['__trigger__']) {
      const trigger = unitMembers[0].deal['__trigger__'];
      groupDeals[gid] = { type: 'unit', trigger, items: {} };
      unitMembers.forEach(m => {
        groupDeals[gid].items[m.id] = {
          dealUnit: m.deal['unit'],
          normalUnit: unitPrices[m.id] || 0,
          priceElId: 'p' + m.id,
        };
      });
      return;
    }

    // ── 下拉選單（select）群組：勾選數量達標即觸發 ──
    members.forEach(m => {
      if (m.deal['unit'] || m.deal['buddy'] !== undefined || m.deal['buddy_unit'] !== undefined) return;
      const optionKeys = Object.keys(m.deal).filter(k => !k.startsWith('__'));
      if (!optionKeys.length) return;
      const trigger = m.deal['__trigger__'] || 0;
      if (!trigger) return;
      if (!groupDeals[gid]) groupDeals[gid] = { trigger, type: 'select', items: {} };
      const options = {};
      optionKeys.forEach(k => { options[k] = m.deal[k]; });
      groupDeals[gid].items[m.id] = { options, priceElId: 'p' + m.id };
    });
  });
}

// 重新整理下拉選單型群組（勾選/取消/切換優惠模式時呼叫）
function refreshSelectGroup(groupId){
  const group = groupDeals[groupId];
  if (!group || group.type !== 'select') return;

  const checkedCount = Object.keys(group.items).filter(id => C.has(id)).length;
  const triggered = dealModeOn && checkedCount >= group.trigger;

  Object.entries(group.items).forEach(([id, info]) => {
    const el = document.getElementById(id);
    if (!el) return;
    const sel = el.querySelector('select.os:not([id^="pico"]):not([id^="mrf"]):not([id^="jalupro"]):not([id^="sel-"]):not([id^="kr-"]):not([id^="bt-"])');
    if (sel) {
      sel.querySelectorAll('option').forEach((opt, i) => {
        const key = String(i);
        if (triggered && info.options[key] !== undefined) {
          if (opt.dataset.overrideGroup === undefined) {
            opt.dataset.normalValue = opt.value;
            opt.dataset.normalText  = opt.text;
          }
          opt.value = info.options[key];
          opt.text  = '⭐ ' + opt.dataset.normalText;
          opt.dataset.overrideGroup = groupId;
        } else if (!triggered && opt.dataset.overrideGroup === groupId) {
          opt.value = opt.dataset.normalValue;
          opt.text  = opt.dataset.normalText;
          delete opt.dataset.normalValue;
          delete opt.dataset.normalText;
          delete opt.dataset.overrideGroup;
        }
      });
      if (C.has(id)) {
        const curVal = parseInt(sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].value) || 0;
        setPD(info.priceElId, curVal);
        P[id] = curVal;
        O[id] = (sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].text) || '';
      }
    }
    syncDealOnClass(id);
  });
  upd();
}

// 取得同群組所有已勾選項目的總支數（未勾選不算；buddy 群組不適用）
function getGroupQty(groupId, selfId){
  const group = groupDeals[groupId];
  if (!group || group.type === 'buddy' || !group.items) return 0;
  let total = 0;
  Object.keys(group.items).forEach(id => {
    if (id !== selfId && !C.has(id)) return;
    const el  = document.getElementById(id);
    const inp = el && el.querySelector('input[type="number"]');
    total += parseInt((inp && inp.value) || 0);
  });
  return total;
}

// 某個 unit 群組成員被取消勾選後，重新計算其他已勾選成員的價格
function refreshUnitGroup(groupId){
  const group = groupDeals[groupId];
  if (!group || group.type !== 'unit') return;
  const effQty = Object.keys(group.items)
    .filter(id => C.has(id))
    .reduce((sum, id) => {
      const el  = document.getElementById(id);
      const inp = el && el.querySelector('input[type="number"]');
      return sum + (parseInt(inp && inp.value) || 0);
    }, 0);
  const triggered = effQty >= group.trigger;
  Object.entries(group.items).forEach(([id, info]) => {
    if (!C.has(id)) return;
    const el = document.getElementById(id);
    if (!el) return;
    const qty  = parseInt(el.querySelector('input[type="number"]').value) || 0;
    const unit = triggered ? info.dealUnit : info.normalUnit;
    P[id] = qty * unit;
    O[id] = qty + '支 × ¥' + unit.toLocaleString() + ' = ¥' + P[id].toLocaleString() + (triggered ? ' 🎉' : '');
    setPD(info.priceElId, qty > 0 ? P[id] : 0);
    updateQtyDealHint(id, effQty, group.trigger, info.dealUnit, info.normalUnit, dealModeOn, triggered);
  });
}

// 找出某項目是哪個 buddy 群組的主項目
function findBuddyGroupOf(id){
  let found = null;
  Object.entries(groupDeals).forEach(([gid, g]) => {
    if (g.type === 'buddy' && g.primary.id === id) found = gid;
  });
  return found;
}

function buddyGroupTriggered(gid){
  const g = groupDeals[gid];
  if (!g || g.type !== 'buddy') return false;
  const n = (C.has(g.primary.id) ? 1 : 0) + g.buddies.filter(b => C.has(b)).length;
  return n >= g.trigger;
}

// buddy 群組：主項目 + 任意夥伴同時勾選 → 主項目單價變優惠價
function refreshBuddyGroup(gid){
  const group = groupDeals[gid];
  if (!group || group.type !== 'buddy' || !dealModeOn) return;

  const primary = group.primary;
  const el = document.getElementById(primary.id);
  if (!el) return;

  const checkedCount = (C.has(primary.id) ? 1 : 0) + group.buddies.filter(bid => C.has(bid)).length;
  const triggered = checkedCount >= group.trigger;

  const inp = el.querySelector('input[type="number"]');
  const qty = parseInt(inp && inp.value) || 0;

  // 未觸發時用「當前有效單價」（可能已有獨立的 unit 優惠）
  const standaloneEntry = getDealsForElement(primary.id).find(e => e.deal['unit'] !== undefined);
  const effectiveNormalUnit = (standaloneEntry ? standaloneEntry.deal.unit : primary.normalUnit);
  const unit  = triggered ? primary.dealUnit : effectiveNormalUnit;
  const total = qty * unit;

  setPD(primary.priceElId, qty > 0 && C.has(primary.id) ? total : unit);
  if (C.has(primary.id)) {
    P[primary.id] = total;
    O[primary.id] = qty + '支 × ¥' + unit.toLocaleString() + (triggered ? ' 🎉 同打優惠' : '');
  }

  el.classList.toggle('deal-on', triggered && C.has(primary.id));

  let hint = el.querySelector('.qty-deal-hint');
  if (!C.has(primary.id)) {
    if (hint) hint.style.display = 'none';
  } else {
    if (!hint) {
      hint = document.createElement('div');
      hint.className = 'qty-deal-hint';
      const crow = el.querySelector('.crow');
      if (crow) crow.insertAdjacentElement('afterend', hint);
      else if (el.querySelector('.opts')) el.querySelector('.opts').appendChild(hint);
    }
    if (triggered) {
      hint.className = 'qty-deal-hint active';
      hint.innerHTML = '🎉 ' + primary.note + ' <span class="qty-deal-price">¥'
        + primary.dealUnit.toLocaleString() + '</span> /支（原價 ¥'
        + primary.normalUnit.toLocaleString() + '）';
    } else {
      const need = group.trigger - checkedCount;
      hint.className = 'qty-deal-hint inactive';
      hint.innerHTML = '搭配其他項目同打可享 <span style="color:var(--gold)">¥'
        + primary.dealUnit.toLocaleString() + '</span> /支　（再勾選 <strong>'
        + need + '</strong> 項即可觸發）';
    }
  }
  upd();
}

/* ── 套用單一筆優惠到某個項目 ──
   （原本散在 4 個補丁裡的 buddy / extra群組 / 群組藥丸 判斷都收在這裡） */
function applyDealToEl(el, id, deal, on){
  if (!el || !deal) return;

  // ① extra_items 的「同時優惠」群組 → 交給 refreshExtraGroups() 統一處理
  if (deal['__group__'] && el.dataset && el.dataset.extraDealKey) return;

  // ② buddy 群組
  const buddyGid = findBuddyGroupOf(id);
  if (buddyGid) {
    // 主項目：只保存/清除原價，實際價格由 refreshBuddyGroup() 決定
    if (on) {
      if (!el.dataset.buddyNormalUnit) el.dataset.buddyNormalUnit = unitPrices[id] || '';
    } else {
      delete el.dataset.buddyNormalUnit;
      const hint = el.querySelector('.qty-deal-hint');
      if (hint) hint.style.display = 'none';
      el.classList.remove('deal-on');
    }
  } else if (deal['buddy'] !== undefined) {
    // 夥伴項目：拿掉 buddy 這個 key，其餘（例如自己的 unit 優惠）照常套用
    const rest = Object.fromEntries(Object.entries(deal).filter(([k]) => k !== 'buddy'));
    if (!Object.keys(rest).some(k => !k.startsWith('__'))) return;   // 純 buddy 行
    deal = rest;
  }

  // ③ 一般優惠（下拉／藥丸／支數／固定價／cc 費率／導入液…）
  applyDealBase(el, id, deal, on);

  // ④ 群組藥丸優惠（m_val1 / l_val2 這種「整個部位群組同價」）
  if (applyGroupPillDeal(el, id, deal, on)) {
    const fnName = GROUP_PILL_RECOMPUTE[id];
    if (fnName && typeof window[fnName] === 'function') window[fnName]();
  }
}

function applyDealBase(el, id, deal, on){
  // select 型群組項目交給 refreshSelectGroup 處理，這裡跳過
  const gid = deal['__group__'] || '';
  if (gid && groupDeals[gid] && groupDeals[gid].type === 'select') {
    el.classList.toggle('deal-on', on && C.has(id));
    return;
  }

  el.classList.toggle('deal-on', on);

  // ── 下拉選單 ──
  const sel = el.querySelector('select.os:not([id^="pico"]):not([id^="mrf"]):not([id^="jalupro"]):not([id^="sel-"]):not([id^="kr-"]):not([id^="bt-"])');
  if (sel) {
    sel.querySelectorAll('option').forEach((opt, i) => {
      const key = String(i);
      if (on && deal[key] !== undefined) {
        opt.dataset.normalValue = opt.dataset.normalValue || opt.value;
        opt.dataset.normalText  = opt.dataset.normalText  || opt.text;
        opt.value = deal[key];
        opt.text  = '⭐ ' + opt.dataset.normalText;
      } else if (!on && opt.dataset.normalValue) {
        opt.value = opt.dataset.normalValue;
        opt.text  = opt.dataset.normalText;
        delete opt.dataset.normalValue;
        delete opt.dataset.normalText;
      }
    });
    const curVal = parseInt(sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].value) || 0;
    setPD('p' + id, curVal);
    if (C.has(id)) {
      P[id] = curVal;
      O[id] = (sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].text) || '';
      upd();
    }
  }

  // ── 通用藥丸優惠（key = 累計索引，val1 = 1次、val2 = 2次/套組）──
  const numericKeys = Object.keys(deal).filter(k => /^\d+$/.test(k));
  if (numericKeys.length > 0 && !el.querySelector('select.os')) {
    const allPillGroups = el.querySelectorAll('.pill-group');
    let globalIdx = 0;
    const pillMap = {};
    allPillGroups.forEach(pg => {
      pg.querySelectorAll('.pill').forEach(pill => {
        pillMap[globalIdx]     = { pill, valKey: 'val1' };
        pillMap[globalIdx + 1] = { pill, valKey: 'val2' };
        globalIdx += 2;
      });
    });

    numericKeys.forEach(k => {
      const entry = pillMap[parseInt(k)];
      if (!entry) return;
      const { pill, valKey } = entry;
      if (on) {
        if (!pill.dataset['_orig_' + valKey]) pill.dataset['_orig_' + valKey] = pill.dataset[valKey] || '0';
        pill.dataset[valKey] = deal[k];
      } else if (pill.dataset['_orig_' + valKey] !== undefined) {
        pill.dataset[valKey] = pill.dataset['_orig_' + valKey];
        delete pill.dataset['_orig_' + valKey];
      }
    });

    const updFnMap = {
      's0t31':  morpheusFaceU,
      's0t31b': morpheusBodyU,
      's2t6':   ondaBodyU,
      's0t21':  () => pillAreaTimesU('s0t21','ps0t21'),
      's0t22':  () => pillAreaTimesU('s0t22','ps0t22'),
      's1t50':  () => pillSimpleU('s1t50','ps1t50'),
      's1t52':  () => pillSimpleU('s1t52','ps1t52'),
      's1t56':  () => pillSimpleU('s1t56','ps1t56'),
      's1t58':  gyokuU,
      's1t41':  dermaPenBodyU,
    };
    if (updFnMap[id]) updFnMap[id]();
  }

  // ── 支數計算項目（unit）──
  if (deal['unit'] !== undefined) {
    const trigger = deal['__trigger__'] || 0;
    const groupId = deal['__group__'] || '';
    if (on) {
      if (!el.dataset.normalUnit) el.dataset.normalUnit = unitPrices[id] || '';
      if (!trigger) {
        unitPrices[id] = deal['unit'];
        if (id === 's1t26') rates.jalu26.unit = deal['unit'];
      }
    } else if (el.dataset.normalUnit) {
      unitPrices[id] = Number(el.dataset.normalUnit);
      if (id === 's1t26') rates.jalu26.unit = Number(el.dataset.normalUnit);
      delete el.dataset.normalUnit;
    }
    const curUnit = unitPrices[id] || (id === 's1t26' ? rates.jalu26.unit : 0);
    setPD('p' + id, curUnit);
    const cu = el.querySelector('.cu');
    if (cu) cu.textContent = cu.textContent.replace(/¥[\d,]+/, '¥' + curUnit.toLocaleString());
    if (C.has(id)) {
      const inp = el.querySelector('input[type="number"]');
      const qty = parseInt(inp && inp.value) || 1;
      P[id] = qty * curUnit;
      upd();
    }
    if (trigger) {
      const inp2 = el.querySelector('input[type="number"]');
      const effQty = groupId ? getGroupQty(groupId, id) : (parseInt(inp2 && inp2.value) || 1);
      const normalUnit = Number(el.dataset.normalUnit) || curUnit;
      updateQtyDealHint(id, effQty, trigger, deal['unit'], normalUnit, on, on && effQty >= trigger);
    }
  }

  // ── 固定價格 ──
  if (deal['static'] !== undefined) {
    const normalVal = on ? null : (parseFloat(el.dataset.normalStatic) || staticPrices[id] || 0);
    const displayVal = on ? deal['static'] : normalVal;
    if (on) {
      if (!el.dataset.normalStatic) el.dataset.normalStatic = el.dataset.currentPrice || staticPrices[id] || 0;
      el.dataset.currentPrice = deal['static'];
    } else {
      el.dataset.currentPrice = el.dataset.normalStatic || staticPrices[id] || 0;
      delete el.dataset.normalStatic;
    }
    setPD('p' + id, displayVal);
    if (C.has(id)) { P[id] = displayVal; upd(); }
  }

  // ── [times] 藥丸優惠（extra 項目的次數選項）──
  const timesKeys = Object.keys(deal).filter(k => !k.startsWith('__') && k.startsWith('[times]'));
  if (timesKeys.length > 0) {
    const tg = el.querySelector('[id^="pg-t-"]');
    if (tg) {
      tg.querySelectorAll('.pill').forEach(pill => {
        const cleanText = pill.textContent.replace(/^⭐\s*/, '').trim();
        const matchKey = '[times]' + cleanText;
        if (deal[matchKey] === undefined) return;
        if (on) {
          if (!pill.dataset.normalVal) pill.dataset.normalVal = pill.dataset.val;
          pill.dataset.val = deal[matchKey];
          if (!pill.textContent.startsWith('⭐')) pill.textContent = '⭐ ' + pill.textContent;
        } else {
          if (pill.dataset.normalVal) {
            pill.dataset.val = pill.dataset.normalVal;
            delete pill.dataset.normalVal;
          }
          pill.textContent = pill.textContent.replace(/^⭐\s*/, '').trim();
        }
      });
      if (C.has(id)) extraPillU(id);
    }
  }

  // ── cc 分段費率優惠（BNLS / FatX Core）──
  const ccRateMap = {
    's1t44': { rateObj: rates.bnls, keys: ['r1','r2'],      fn: bnlsU },
    's1t46': { rateObj: rates.fatx, keys: ['r1','r2','r3'], fn: fatxU },
  };
  if (ccRateMap[id]) {
    const { rateObj, keys, fn } = ccRateMap[id];
    ['rate1','rate2','rate3'].forEach((rk, i) => {
      if (deal[rk] === undefined || keys[i] === undefined) return;
      const dk = 'normalR' + (i + 1);
      if (on) {
        if (!el.dataset[dk]) el.dataset[dk] = rateObj[keys[i]];
        rateObj[keys[i]] = deal[rk];
      } else if (el.dataset[dk]) {
        rateObj[keys[i]] = Number(el.dataset[dk]);
        delete el.dataset[dk];
      }
    });
    fn();
  }

  // ── Jalupro Superhydro 的加做煥膚 ──
  if (deal['glow'] !== undefined && id === 's1t26') {
    const gs = document.getElementById('jalupro26-glow');
    if (gs && gs.options[1]) {
      if (on) {
        if (!gs.options[1].dataset.normalValue) {
          gs.options[1].dataset.normalValue = gs.options[1].value;
          gs.options[1].dataset.normalText  = gs.options[1].text;
        }
        gs.options[1].value = deal['glow'];
        gs.options[1].text  = '⭐ ' + gs.options[1].dataset.normalText;
      } else if (gs.options[1].dataset.normalValue) {
        gs.options[1].value = gs.options[1].dataset.normalValue;
        gs.options[1].text  = gs.options[1].dataset.normalText;
        delete gs.options[1].dataset.normalValue;
        delete gs.options[1].dataset.normalText;
      }
      rates.jalu26.glow = on ? deal['glow'] : (parseInt(gs.options[1].dataset.normalValue) || 7000);
      if (C.has('s1t26')) jalu26U();
    }
  }
}

/* 群組藥丸優惠：monthly_deals 用「群組後綴_valN」填一次，
   就套用到 pg-項目ID-後綴 底下所有部位（例：m_val1 / l_val2） */
function applyGroupPillDeal(el, id, deal, on){
  const keys = Object.keys(deal).filter(k => /^[a-zA-Z0-9]+_val\d+$/.test(k));
  if (!keys.length) return false;

  keys.forEach(k => {
    const m = k.match(/^(.+)_val(\d+)$/);
    if (!m) return;
    const suffix = m[1];
    const slot   = 'val' + m[2];
    const pg = document.getElementById('pg-' + id + '-' + suffix);
    if (!pg) return;
    pg.querySelectorAll('.pill').forEach(pill => {
      const store = 'grpDealOrig' + slot;
      if (on) {
        if (pill.dataset[store] === undefined) pill.dataset[store] = pill.dataset[slot] || '0';
        pill.dataset[slot] = deal[k];
      } else if (pill.dataset[store] !== undefined) {
        pill.dataset[slot] = pill.dataset[store];
        delete pill.dataset[store];
      }
    });
  });
  return true;
}


/* ══════════════════════════════════════════════════════════════
   2. extra_items 的「同時優惠」群組
   ══════════════════════════════════════════════════════════════ */

function buildExtraGroups(){
  extraGroups = {};
  if (!extraDealsData) return;
  Object.entries(extraDealsData).forEach(([key, deal]) => {
    const gid = deal && deal['__group__'];
    if (!gid) return;
    if (!extraGroups[gid]) extraGroups[gid] = { trigger: 2, members: [] };
    if (deal['__trigger__']) extraGroups[gid].trigger = parseInt(deal['__trigger__']) || 2;
    extraGroups[gid].members.push({ key, deal });
  });
}

function findExtraEl(key, deal){
  let el = null;
  document.querySelectorAll('[data-extra-deal-key]').forEach(c => {
    if (!el && c.dataset.extraDealKey === key) el = c;
  });
  if (el) return el;
  const name = deal && deal['__name__'];
  if (!name) return null;
  const cat = (deal && deal['__cat__']) || '';
  document.querySelectorAll('[id^="extra-item-"]').forEach(c => {
    if (el) return;
    if ((c.dataset.name || '') !== name) return;
    if (!cat) { el = c; return; }
    const catEl = c.closest('.cat');
    const title = (catEl && catEl.querySelector('.ctit') ? catEl.querySelector('.ctit').textContent.replace('✦','').trim() : '');
    if (title.includes(cat) || cat.includes(title)) el = c;
  });
  return el;
}

function extraGroupApplyOverride(el, deal){
  const sel = el.querySelector('select.os');
  if (!sel) return;
  sel.querySelectorAll('option').forEach((opt, i) => {
    const k = String(i);
    if (deal[k] === undefined) return;
    if (opt.dataset.grpNorm === undefined) {
      opt.dataset.grpNorm    = opt.value;
      opt.dataset.grpNormTxt = opt.text;
    }
    opt.value = deal[k];
    opt.text  = '⭐ ' + opt.dataset.grpNormTxt;
  });
}

function extraGroupRestore(el){
  const sel = el.querySelector('select.os');
  if (!sel) return;
  sel.querySelectorAll('option').forEach(opt => {
    if (opt.dataset.grpNorm === undefined) return;
    opt.value = opt.dataset.grpNorm;
    opt.text  = opt.dataset.grpNormTxt;
    delete opt.dataset.grpNorm;
    delete opt.dataset.grpNormTxt;
  });
}

function extraGroupRecompute(el){
  const sel = el.querySelector('select.os');
  if (!sel) return;
  const price = parseInt(sel.value) || 0;
  const label = (sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].text) || '';
  el.dataset.currentPrice = price;
  setPD('p' + el.id, price);
  if (C.has(el.id)) { P[el.id] = price; O[el.id] = label; }
}

function refreshExtraGroups(){
  if (!Object.keys(extraGroups).length) return;
  const elInfo = new Map();

  Object.values(extraGroups).forEach(group => {
    const resolved = group.members
      .map(m => ({ deal: m.deal, el: findExtraEl(m.key, m.deal) }))
      .filter(x => x.el);
    const checkedCount = resolved.filter(x => C.has(x.el.id)).length;
    const triggered = dealModeOn && checkedCount >= group.trigger;
    resolved.forEach(({deal, el}) => {
      if (!elInfo.has(el)) elInfo.set(el, []);
      elInfo.get(el).push({ deal, triggered });
    });
  });

  elInfo.forEach((entries, el) => {
    const activeEntry = entries.find(e => e.triggered);
    const apply = !!activeEntry && C.has(el.id);

    extraGroupRestore(el);
    if (activeEntry) extraGroupApplyOverride(el, activeEntry.deal);

    el.classList.toggle('deal-on', apply);
    extraGroupRecompute(el);

    const badge = el.querySelector('.deal-badge');
    if (badge) {
      if (apply && activeEntry.deal['__note__']) {
        if (badge.dataset.defNote === undefined) badge.dataset.defNote = badge.textContent;
        badge.textContent = activeEntry.deal['__note__'];
      } else if (badge.dataset.defNote !== undefined) {
        badge.textContent = badge.dataset.defNote;
      }
    }
  });

  upd();
}

// 建立頁首控制列（分院篩選 + 當月優惠開關）
function initHeaderControls(){
  const st = document.getElementById('price-status');
  const dealBar = document.getElementById('deal-bar');
  if (!st || document.getElementById('header-controls')) return;
  const wrap = document.createElement('div');
  wrap.id = 'header-controls';
  wrap.innerHTML =
    '<div class="clinic-bar" id="clinic-bar" style="display:none">' +
      '<span class="deal-label">分院篩選</span>' +
      '<select id="clinic-sel" onchange="setClinic(this.value)">' +
        '<option value="all">🏥 全部分院</option>' +
      '</select>' +
    '</div>';
  st.insertAdjacentElement('afterend', wrap);
  if (dealBar) wrap.appendChild(dealBar);
}

function setClinic(v){ currentClinic = v; applyClinicFilter(); }

function populateClinicOptions(data){
  const bar = document.getElementById('clinic-bar');
  const sel = document.getElementById('clinic-sel');
  if (!bar || !sel || !data || !Array.isArray(data.names) || !data.names.length) return;
  clinicMap = data.map || {};
  while (sel.options.length > 1) sel.remove(1);
  const mkOpt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; };
  if (data.cityGroups && Array.isArray(data.cityOrder) && data.cityOrder.length) {
    data.cityOrder.forEach(city => {
      const g = document.createElement('optgroup');
      g.label = city;
      (data.cityGroups[city] || []).forEach(n => g.appendChild(mkOpt(n, n)));
      sel.appendChild(g);
    });
  } else {
    data.names.forEach(n => sel.appendChild(mkOpt(n, n)));
  }
  bar.style.display = 'flex';
}

function applyClinicFilter(){
  const clinic = currentClinic;

  document.querySelectorAll('.ti').forEach(ti => {
    if (clinic === 'all') { ti.style.display = ''; return; }
    // 優先用 ID 查，找不到再用 data-name 查；都沒有 → 視為全院都有
    const row = clinicMap[ti.id] || clinicMap[ti.dataset.name || ''] || null;
    ti.style.display = (row === null || row[clinic]) ? '' : 'none';
  });

  // 整個分類都被隱藏時，連分類標題一起隱藏
  document.querySelectorAll('.cat').forEach(cat => {
    const items = cat.querySelectorAll('.ti');
    if (!items.length) { cat.style.display = ''; return; }
    const allHidden = Array.from(items).every(ti => ti.style.display === 'none');
    cat.style.display = allHidden ? 'none' : '';
  });
}


/* ══════════════════════════════════════════════════════════════
   4. Google Sheets 價格同步
   ══════════════════════════════════════════════════════════════ */

async function loadSheetPrices(){
  const st = document.getElementById('price-status');
  if (!APPS_SCRIPT_URL) {
    st.textContent = '使用內建價格（未設定 Sheet URL）';
    st.className = 'price-status err';
    sortCats();
    return;
  }
  try {
    st.textContent = '正在從 Google Sheets 同步價格…';
    st.className = 'price-status loading';
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    applySheetPrices(data);

    // 官網連結
    Object.entries(data).forEach(([id, keys]) => {
      if (keys && typeof keys === 'object' && !Array.isArray(keys) && keys['__link__']) {
        addLinkToItem(id, keys['__link__']);
      }
    });

    // 當月優惠
    if (data['__deals__'] && Object.keys(data['__deals__']).length > 0) dealsData = data['__deals__'];
    if (data['__extra_deals__'] && Object.keys(data['__extra_deals__']).length > 0) extraDealsData = data['__extra_deals__'];
    if (Object.keys(dealsData).length > 0 || Object.keys(extraDealsData).length > 0) {
      document.getElementById('deal-bar').style.display = 'flex';
      applyDealBadges();
      buildGroupDeals();
      removePureBuddyBadges();
      buildExtraGroups();
      refreshExtraGroups();
    }

    // 分院篩選選項
    populateClinicOptions(data['__clinics__']);

    st.textContent = '✓ 價格已同步 Google Sheets';
    st.className = 'price-status ok';
  } catch(e) {
    console.warn('[Sheet 載入失敗]', e);
    st.textContent = '⚠ Sheet 載入失敗，使用內建價格';
    st.className = 'price-status err';
  }
  sortCats();
}

function applySheetPrices(data) {
  // ── 共用導入液 ──
  if (data.liquid) {
    ['pico24-liq','pico34-liq','pico25-liq','pico26-liq','mrf-liq','dp40-liq','dp41-liq'].forEach(sid => {
      const sel = document.getElementById(sid);
      if (!sel) return;
      Object.entries(data.liquid).forEach(([k,v]) => {
        const i = parseInt(k);
        if (!isNaN(i) && sel.options[i]) sel.options[i].value = v;
      });
    });
  }

  for (const [id, keys] of Object.entries(data)) {
    if (id === 'liquid') continue;
    const el = document.getElementById(id);

    // ── Pill 項目 Sheet 價格同步 ──
    if(id==='s1t50'){const pg=document.getElementById('pg-s1t50');if(keys['0']!==undefined&&pg)pg.dataset.unit=keys['0'];if(keys['0']!==undefined)setPD('ps1t50',keys['0']);continue;}
    if(id==='s1t52'){const pg=document.getElementById('pg-s1t52');if(keys['0']!==undefined&&pg)pg.dataset.unit=keys['0'];if(keys['0']!==undefined)setPD('ps1t52',keys['0']);continue;}
    if(id==='s1t56'){const pg=document.getElementById('pg-s1t56');if(keys['0']!==undefined&&pg)pg.dataset.unit=keys['0'];if(keys['0']!==undefined)setPD('ps1t56',keys['0']);continue;}
    if(id==='s1t41'){const pg=document.getElementById('pg-s1t41-part');if(pg){const pp=pg.querySelectorAll('.pill');[0,1,2].forEach(i=>{if(pp[i]){if(keys['0']!==undefined)pp[i].dataset.val1=keys['0'];if(keys['1']!==undefined)pp[i].dataset.val2=keys['1'];}});[3,4].forEach(i=>{if(pp[i]){if(keys['2']!==undefined)pp[i].dataset.val1=keys['2'];if(keys['3']!==undefined)pp[i].dataset.val2=keys['3'];}});}if(keys['0']!==undefined)setPD('ps1t41',keys['0']);continue;}
    if(id==='s0t21'){const tg=document.getElementById('pg-s0t21-t');if(tg){const pp=tg.querySelectorAll('.pill');if(keys['0']!==undefined&&pp[0])pp[0].dataset.val=keys['0'];if(keys['1']!==undefined&&pp[1])pp[1].dataset.val=keys['1'];}if(keys['0']!==undefined)setPD('ps0t21',keys['0']);continue;}

   5. extra_items（Sheet 自訂新增項目）

// 分類名稱 → 對應的既有 tab index
const TAB_MAP = {
  '音電波雷射': 0, '雷射': 0,
  '注射': 1, '針劑': 1, '肉毒': 1, '玻尿酸': 1,
  '麻醉': 2,
  '抽脂': 3,
  '煥膚': 4, '保養': 4,
};
const dynamicTabs = {};

// 確保指定 section 有 .main div（找不到 section 就建立）
function ensureMain(idx) {
  let section = document.querySelector('#sh' + idx);
  if (!section) {
    section = document.createElement('div');
    section.className = 'sp';
    section.id = 'sh' + idx;
    const allSp = document.querySelectorAll('.sp');
    allSp[allSp.length - 1].insertAdjacentElement('afterend', section);
  }
  let main = section.querySelector('.main');
  if (!main) {
    main = document.createElement('div');
    main.className = 'main';
    section.appendChild(main);
  }
  return main;
}

function getOrCreateTab(tabName) {
  // 1. 查 TAB_MAP
  for (const [key, idx] of Object.entries(TAB_MAP)) {
    if (tabName.includes(key) || key.includes(tabName)) { ensureMain(idx); return idx; }
  }
  // 2. 查已動態建立的 tab
  if (dynamicTabs[tabName] !== undefined) return dynamicTabs[tabName];
  // 3. 掃描現有按鈕文字
  for (const btn of document.querySelectorAll('.tabs .tb')) {
    const btnText = btn.textContent.replace(/✦/g,'').trim();
    if (btnText === tabName || btnText.includes(tabName) || tabName.includes(btnText)) {
      const onclickStr = btn.getAttribute('onclick') || '';
      const match = onclickStr.match(/sw\((\d+)/);
      if (match) { const idx = parseInt(match[1]); ensureMain(idx); return idx; }
    }
  }
  // 4. 全新 tab
  const allSp = document.querySelectorAll('.sp');
  const newIdx = allSp.length;

  const spDiv = document.createElement('div');
  spDiv.className = 'sp';
  spDiv.id = 'sh' + newIdx;
  const mainDiv = document.createElement('div');
  mainDiv.className = 'main';
  spDiv.appendChild(mainDiv);
  allSp[allSp.length - 1].insertAdjacentElement('afterend', spDiv);

  const tabsEl = document.querySelector('.tabs');
  const btn = document.createElement('button');
  btn.className = 'tb';
  btn.textContent = '✦ ' + tabName;
  btn.setAttribute('onclick', 'sw(' + newIdx + ',this)');
  const anesthesiaBtn = Array.from(tabsEl.querySelectorAll('.tb')).find(b => b.textContent.includes('麻醉'));
  if (anesthesiaBtn) tabsEl.insertBefore(btn, anesthesiaBtn);
  else tabsEl.appendChild(btn);

  dynamicTabs[tabName] = newIdx;
  return newIdx;
}

function renderExtraItems(extras) {
  document.querySelectorAll('[id^="extra-item-"]').forEach(el => el.remove());
  document.querySelectorAll('[id^="extra-cat-"]').forEach(el => el.remove());

  const groups = {};
  extras.forEach((item, i) => {
    const tab = item.tab || '其他';
    const cat = item.cat || '';
    const groupKey = tab + '||' + cat;
    if (!groups[groupKey]) groups[groupKey] = { tab, cat, items: [] };
    groups[groupKey].items.push({ ...item, _i: i });
  });

  Object.values(groups).forEach(({ tab: tabName, cat: catName, items }) => {
    const tabIdx = getOrCreateTab(tabName);
    const mainEl = document.querySelector('#sh' + tabIdx + ' .main');
    if (!mainEl) return;

    let targetCat = null;
    if (catName) {
      mainEl.querySelectorAll('.cat').forEach(cat => {
        const title = (cat.querySelector('.ctit') ? cat.querySelector('.ctit').textContent.replace('✦','').trim() : '');
        if (title.includes(catName) || catName.includes(title)) targetCat = cat;
      });
    }
    if (!targetCat) {
      targetCat = document.createElement('div');
      targetCat.className = 'cat';
      targetCat.id = 'extra-cat-' + tabName + '-' + catName;
      targetCat.innerHTML = '<div class="chd"><div class="cbar"></div><div class="ctit">✦ ' + (catName || tabName) + '</div></div>';
      mainEl.appendChild(targetCat);
    }

    items.forEach(item => {
      const eid = 'extra-item-' + item._i;
      const allOpts = item.options || [{ label: '', price: item.price }];

      // [discount-N] 行：N 個部位以上打折
      const discounts = {};
      const opts = [];
      allOpts.forEach(o => {
        const m = o.label && o.label.match(/^\[discount-(\d+)\]/);
        if (m) discounts[parseInt(m[1])] = o.price > 1 ? o.price / 100 : o.price;
        else opts.push(o);
      });

      const firstPrice = (opts[0] && opts[0].price) || 0;
      const firstLabel = (opts[0] && opts[0].label) || '';
      const isPill   = opts.some(o => o.label.startsWith('[pill]') || o.label.startsWith('[times]'));
      const qtyMatch = !isPill && opts.length === 1 && firstLabel.match(/^\[(.+)\]$/);
      const isQty    = !!qtyMatch;
      const isSelect = !isPill && !isQty && (opts.length > 1 || (opts.length === 1 && firstLabel));
      const unit     = isQty ? qtyMatch[1] : '';

      const linkHtml = item.link
        ? '<a href="' + item.link + '" target="_blank" rel="noopener noreferrer" class="item-link" title="查看官網" onclick="event.stopPropagation()">↗</a>'
        : '';
      const nameHtml = item.name + (item.note ? '<span class="note">' + item.note + '</span>' : '') + linkHtml;

      const tiDiv = document.createElement('div');
      tiDiv.className = 'ti';
      tiDiv.id = eid;
      tiDiv.dataset.name = item.name;
      tiDiv.dataset.currentPrice = firstPrice;
      tiDiv.dataset.unitPrice = firstPrice;
      if (Object.keys(discounts).length > 0) tiDiv.dataset.discounts = JSON.stringify(discounts);

      if (isPill) {
        const areaOpts  = opts.filter(o => o.label.startsWith('[pill]'));
        const timesOpts = opts.filter(o => o.label.startsWith('[times]'));
        const hasTimes  = timesOpts.length > 0;
        const areaPillsHtml = areaOpts.map(o =>
          '<span class="pill" data-val="' + o.price + '" onclick="pillToggle(this);extraPillU(\'' + eid + '\')">' + o.label.replace('[pill]','').trim() + '</span>'
        ).join('');
        const timesPillsHtml = hasTimes ? timesOpts.map((o, i) =>
          '<span class="pill' + (i===0?' active':'') + '" data-val="' + o.price + '" onclick="pillRadio(this,\'pg-t-' + eid + '\');extraPillU(\'' + eid + '\')">' + o.label.replace('[times]','').trim() + '</span>'
        ).join('') : '';
        const timesSection = hasTimes
          ? '<div class="ol">次數</div><div class="pill-group" id="pg-t-' + eid + '">' + timesPillsHtml + '</div>'
          : '';
        const defPrice = hasTimes ? ((timesOpts[0] && timesOpts[0].price) || firstPrice) : ((areaOpts[0] && areaOpts[0].price) || firstPrice);
        tiDiv.dataset.currentPrice = 0;
        tiDiv.dataset.hasTimes = hasTimes ? '1' : '';
        tiDiv.innerHTML =
          '<div class="tim" onclick="togExtraPill(\'' + eid + '\')"><div class="ck"><span class="tk">✓</span></div>' +
          '<div class="tn">' + nameHtml + '</div>' +
          '<div class="pd" id="p' + eid + '"><span class="y">¥</span>' + defPrice.toLocaleString() + '</div></div>' +
          '<div class="opts"><div class="ol">選擇部位（可複選）</div>' +
          '<div class="pill-group" id="pg-' + eid + '">' + areaPillsHtml + '</div>' + timesSection + '</div>';
      } else if (isQty) {
        tiDiv.innerHTML =
          '<div class="tim" onclick="togExtraQty(\'' + eid + '\')"><div class="ck"><span class="tk">✓</span></div>' +
          '<div class="tn">' + nameHtml + '</div>' +
          '<div class="pd" id="p' + eid + '"><span class="y">¥</span>' + firstPrice.toLocaleString() + '</div></div>' +
          '<div class="opts"><div class="ol">輸入' + unit + '數</div><div class="crow">' +
          '<input type="number" class="ci" id="q-' + eid + '" min="1" max="50" step="1" value="1" oninput="extraQtyU(\'' + eid + '\',' + firstPrice + ',\'' + unit + '\',this)">' +
          '<span class="cu">' + unit + '　×　¥' + firstPrice.toLocaleString() + '</span></div></div>';
      } else if (!isSelect) {
        tiDiv.innerHTML =
          '<div class="tim" onclick="togExtraSimple(\'' + eid + '\',' + firstPrice + ')"><div class="ck"><span class="tk">✓</span></div>' +
          '<div class="tn">' + nameHtml + '</div>' +
          '<div class="pd" id="p' + eid + '"><span class="y">¥</span>' + firstPrice.toLocaleString() + '</div></div>' +
          '<div class="opts"></div>';
      } else {
        const optionsHtml = opts.map(o =>
          '<option value="' + o.price + '">' + (o.label ? o.label + '　' : '') + '¥' + o.price.toLocaleString() + '</option>'
        ).join('');
        tiDiv.innerHTML =
          '<div class="tim" onclick="togExtraSelect(\'' + eid + '\')"><div class="ck"><span class="tk">✓</span></div>' +
          '<div class="tn">' + nameHtml + '</div>' +
          '<div class="pd" id="p' + eid + '"><span class="y">¥</span>' + firstPrice.toLocaleString() + '</div></div>' +
          '<div class="opts"><div class="ol">選擇方案</div>' +
          '<select class="os" onchange="extraSelU(\'' + eid + '\',this)">' + optionsHtml + '</select></div>';
      }
      targetCat.appendChild(tiDiv);
    });
  });

  if (currentClinic !== 'all') applyClinicFilter();
}

// 固定價格
function togExtraSimple(id, price) {
  const el = document.getElementById(id);
  if (!el) return;
  if (C.has(id)) {
    C.delete(id); delete P[id]; delete O[id];
    el.classList.remove('on');
  } else {
    const effectivePrice = el.dataset.currentPrice ? parseInt(el.dataset.currentPrice) : price;
    C.add(id); P[id] = effectivePrice; O[id] = '';
    el.classList.add('on');
  }
  upd();
  refreshExtraGroups();
}

// 數量輸入（支/瓶/cc）
function togExtraQty(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const unitPrice = parseInt(el.dataset.unitPrice) || 0;
  const qtyEl = document.getElementById('q-' + id);
  const qty = parseInt(qtyEl && qtyEl.value) || 1;
  const price = qty * unitPrice;
  if (C.has(id)) {
    C.delete(id); delete P[id]; delete O[id];
    el.classList.remove('on');
  } else {
    C.add(id); P[id] = price;
    const unitTxt = (qtyEl && qtyEl.nextElementSibling && qtyEl.nextElementSibling.textContent.split('×')[0].trim()) || '';
    O[id] = qty + unitTxt + ' × ¥' + unitPrice.toLocaleString();
    el.classList.add('on');
  }
  upd();
  refreshExtraGroups();
}

function extraQtyU(id, unitPrice, unit, input) {
  const qty = parseInt(input.value) || 1;
  const price = qty * unitPrice;
  const el = document.getElementById(id);
  if (!el) return;
  el.dataset.currentPrice = price;
  setPD('p' + id, price);
  if (C.has(id)) {
    P[id] = price;
    O[id] = qty + unit + ' × ¥' + unitPrice.toLocaleString();
    upd();
  }
}

// 下拉選單
function togExtraSelect(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const price = parseInt(el.dataset.currentPrice) || 0;
  const sel = el.querySelector('select.os');
  const label = sel ? (sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].text) : '';
  if (C.has(id)) {
    C.delete(id); delete P[id]; delete O[id];
    el.classList.remove('on');

    C.add(id); P[id] = price; O[id] = label;
    el.classList.add('on');
  }
  upd();
  refreshExtraGroups();
}

function extraSelU(id, sel) {
  const price = parseInt(sel.value) || 0;
  const label = (sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].text) || '';
  const el = document.getElementById(id);
  if (!el) return;
  el.dataset.currentPrice = price;
  setPD('p' + id, price);
  if (C.has(id)) { P[id] = price; O[id] = label; upd(); }
  refreshExtraGroups();
}

// 藥丸複選（可含次數 + [discount-N] 階梯折扣）
function extraPillU(eid){
  const el = document.getElementById(eid); if (!el) return;
  const g  = document.getElementById('pg-' + eid); if (!g) return;
  const hasTimes = el.dataset.hasTimes === '1';
  const activeAreas = g.querySelectorAll('.pill.active');
  const discounts = el.dataset.discounts ? JSON.parse(el.dataset.discounts) : {};
  const count = activeAreas.length;

  let discountRate = 1;
  if (Object.keys(discounts).length > 0 && count > 0) {
    Object.keys(discounts).map(Number).sort((a,b) => a-b).forEach(t => {
      if (count >= t) discountRate = discounts[t];
    });
  }

  let total = 0, oLabel = '';
  if (hasTimes) {
    const tg = document.getElementById('pg-t-' + eid);
    const activeTime = tg && tg.querySelector('.pill.active');
    const unit = parseInt(activeTime && activeTime.dataset.val) || 0;
    total = Math.round(count * unit * discountRate);
    const aLabel = Array.from(activeAreas).map(p => p.textContent).join('・');
    const tLabel = (activeTime && activeTime.textContent) || '';
    const dLabel = discountRate < 1 ? ' 🎉 ' + Math.round(discountRate*100) + '%' : '';
    oLabel = [aLabel, tLabel].filter(Boolean).join('　') + dLabel;
    const defP = unit || parseInt(g.querySelector('.pill') && g.querySelector('.pill').dataset.val) || 0;
    setPD('p' + eid, total > 0 ? total : defP);
  } else {
    let subtotal = 0;
    activeAreas.forEach(p => { subtotal += parseInt(p.dataset.val) || 0; });
    total = Math.round(subtotal * discountRate);
    const dLabel = discountRate < 1 ? ' 🎉 ' + Math.round(discountRate*100) + '%' : '';
    oLabel = Array.from(activeAreas).map(p => p.textContent).join('・') + dLabel;
    const defP = parseInt(g.querySelector('.pill') && g.querySelector('.pill').dataset.val) || 0;
    setPD('p' + eid, total > 0 ? total : defP);
  }

  updateExtraDiscountHint(el, count, discounts, discountRate);
  el.dataset.currentPrice = total;
  if (C.has(eid)) { P[eid] = total; O[eid] = oLabel; upd(); }
}

function updateExtraDiscountHint(el, count, discounts, currentRate) {
  const tiers = Object.keys(discounts).map(Number).sort((a,b) => a-b);
  let hint = el.querySelector('.qty-deal-hint');
  if (tiers.length === 0 || count === 0) {
    if (hint) hint.style.display = 'none';
    return;
  }
  if (!hint) {
    hint = document.createElement('div');
    hint.className = 'qty-deal-hint';
    const opts = el.querySelector('.opts');
    if (opts) opts.appendChild(hint);
  }
  const tierDesc = tiers.map(t => t + '部位 ' + Math.round(discounts[t]*100) + '%').join('　|　');
  if (currentRate < 1) {
    hint.className = 'qty-deal-hint active';
    const next = tiers.find(t => t > count);
    const nextHint = next ? '（再加 ' + (next - count) + ' 部位可享 ' + Math.round(discounts[next]*100) + '%）' : '';
    hint.innerHTML = '🎉 已套用 <strong>' + count + '</strong> 部位 <span class="qty-deal-price">' + Math.round(currentRate*100) + '%</span> 優惠' + nextHint +
      '<br><span style="opacity:.7;font-size:9px">' + tierDesc + '</span>';
  } else {
    hint.className = 'qty-deal-hint inactive';
    const next = tiers[0];
    hint.innerHTML = '再加 <strong>' + (next - count) + '</strong> 部位可享 <span style="color:var(--gold)">' + Math.round(discounts[next]*100) + '%</span> 優惠' +
      '<br><span style="opacity:.7;font-size:9px">' + tierDesc + '</span>';
  }
}

/* ── 支數計算（含：多群組優惠 / buddy 同打優惠 / 一般 unit 優惠）── */
function qtyU(itemId, priceElId, defaultUnit, qtyElId){
  const qty = parseInt(document.getElementById(qtyElId)?.value) || 0;
  const baseUnit = unitPrices[itemId] ?? defaultUnit;
  let unitPrice = baseUnit;
  let discountApplied = false;

  if (dealModeOn) {
    // ① 同一項目有多筆 unit 優惠 → 取最低單價
    const multi = getDealsForElement(itemId).filter(e => e.deal['unit'] !== undefined);
    if (multi.length > 1) { qtyUMulti(itemId, priceElId, qty, baseUnit, multi); return; }

    // ② buddy 主項目且已觸發 → 交給 refreshBuddyGroup
    const bGid = findBuddyGroupOf(itemId);
    if (bGid && buddyGroupTriggered(bGid)) { refreshBuddyGroup(bGid); return; }

    // ③ 單筆 unit 優惠
    const entry = getDealsForElement(itemId).find(e => e.deal['unit'] !== undefined);
    const deal = entry ? entry.deal : null;
    if (deal && deal.unit) {
      const trigger = deal.__trigger__ || 0;
      const groupId = deal.__group__ || '';
      if (trigger) {
        const effQty = groupId ? getGroupQty(groupId, itemId) : qty;
        if (effQty >= trigger) { unitPrice = deal.unit; discountApplied = true; }
        updateQtyDealHint(itemId, effQty, trigger, deal.unit, baseUnit, true, discountApplied);
        if (groupId) refreshGroupOthers(groupId, itemId, effQty);
      } else {
        unitPrice = deal.unit; discountApplied = true;
      }
    }
  }

  const total = qty * unitPrice;
  P[itemId] = total;
  O[itemId] = qty > 0 ? qty+'支 × ¥'+unitPrice.toLocaleString()+' = ¥'+total.toLocaleString()+(discountApplied?' 🎉':'') : '';
  setPD(priceElId, qty > 0 ? total : 0);
  upd();
}

// 同一項目跨多個優惠群組時，取最優惠單價
function qtyUMulti(itemId, priceElId, qty, baseUnit, entries){
  let bestUnit = baseUnit, discountApplied = false;
  entries.forEach(({deal}) => {
    const trigger = deal.__trigger__ || 0;
    const groupId = deal.__group__ || '';
    const effQty  = groupId ? getGroupQty(groupId, itemId) + qty : qty;
    const triggered = !trigger || effQty >= trigger;
    if (triggered && deal.unit < bestUnit) { bestUnit = deal.unit; discountApplied = true; }
    if (trigger) updateQtyDealHint(itemId, effQty, trigger, deal.unit, baseUnit, true, triggered);
  });
  const total = qty * bestUnit;
  P[itemId] = total;
  O[itemId] = qty > 0 ? qty+'支 × ¥'+bestUnit.toLocaleString()+' = ¥'+total.toLocaleString()+(discountApplied?' 🎉':'') : '';
  setPD(priceElId, qty > 0 ? total : 0);
  upd();
  entries.forEach(({deal}) => {
    const groupId = deal.__group__ || '';
    if (groupId) refreshGroupOthers(groupId, itemId, getGroupQty(groupId, itemId) + qty);
  });
}

function refreshGroupOthers(groupId, selfId, effQty) {
  const group = groupDeals[groupId];
  if (!group || !group.items) return;
  const triggered = effQty >= group.trigger;
  Object.entries(group.items).forEach(([id, info]) => {
    if (id === selfId || !C.has(id)) return;
    const el = document.getElementById(id);
    if (!el) return;
    const q = parseInt(el.querySelector('input[type="number"]')?.value) || 0;
    const unit = triggered ? info.dealUnit : info.normalUnit;
    P[id] = q * unit;
    O[id] = q+'支 × ¥'+unit.toLocaleString()+' = ¥'+P[id].toLocaleString()+(triggered?' 🎉':'');
    setPD(info.priceElId, q > 0 ? P[id] : 0);
    updateQtyDealHint(id, effQty, group.trigger, info.dealUnit, info.normalUnit, true, triggered);
  });
}

function updateQtyDealHint(itemId, qty, trigger, dealUnit, normalUnit, dealModeActive, discountApplied) {
  const el = document.getElementById(itemId);
  if (!el) return;
  let hint = el.querySelector('.qty-deal-hint');

  if (!dealModeActive || !trigger || !dealUnit) {
    if (hint) { hint.style.display = 'none'; hint.className = 'qty-deal-hint'; }
    return;
  }

  if (!hint) {
    hint = document.createElement('div');
    hint.className = 'qty-deal-hint';
    const crow = el.querySelector('.crow');
    if (crow) crow.insertAdjacentElement('afterend', hint);
    else el.querySelector('.opts')?.appendChild(hint);
  }

  if (discountApplied) {
    hint.className = 'qty-deal-hint active';
    hint.innerHTML = '🎉 折扣已套用！每支 <span class="qty-deal-price">¥' + dealUnit.toLocaleString() + '</span>（原價 ¥' + normalUnit.toLocaleString() + '）';
  } else {
    const need = trigger - qty;
    const entry = getDealsForElement(itemId).find(e => e.deal['unit'] !== undefined);
    const groupId = entry ? (entry.deal['__group__'] || '') : '';
    const groupNote = groupId ? '（任意組合）' : '';
    hint.className = 'qty-deal-hint inactive';
    hint.innerHTML = '再加 <strong>' + need + '</strong> 支' + groupNote + '（共' + trigger + '支以上）可享每支 <span style="color:var(--gold)">¥' + dealUnit.toLocaleString() + '</span>';
  }
}

function tog(id){
  const el=document.getElementById(id);
  if(!el)return;
  if(C.has(id)){
    C.delete(id);delete P[id];delete O[id];
    el.classList.remove('on');
    // 若屬於 unit 群組，取消勾選後重算所有已勾選成員
    if (dealModeOn) {
      Object.entries(groupDeals).forEach(([gid, group]) => {
        if (group.type === 'unit' && group.items[id]) {
          setPD('p' + id, group.items[id].normalUnit);
          refreshUnitGroup(gid);
        }
      });
    }
  }else{
    C.add(id);el.classList.add('on');
    if(id==='s1t0') btoxKrU();
    else if(id==='s1t9') btoxBtU();
    else if(id==='s0t30') mrfU();
    else if(id==='s1t26') jalu26U();
    else if(id==='s1t44') bnlsU();
    else if(id==='s1t45') qtyU('s1t45','ps1t45',17500,'q-s1t45');
    else if(id==='s1t46') fatxU();
    else if(id==='s1t58') gyokuU();
    else if(id==='s1t50') pillSimpleU('s1t50','ps1t50');
    else if(id==='s1t52') pillSimpleU('s1t52','ps1t52');
    else if(id==='s1t56') pillSimpleU('s1t56','ps1t56');
    else if(id==='s0t21') pillAreaTimesU('s0t21','ps0t21');
    else if(id==='s0t22') pillAreaTimesU('s0t22','ps0t22');
    else if(id==='s0t31') morpheusFaceU();
    else if(id==='s0t31b') morpheusBodyU();
    else if(id==='s1t40') dp40U();
    else if(id==='s1t41') dermaPenBodyU();
    else if(id==='s2t6') ondaBodyU();
    else if(id==='s3t0') anU();
    else if(id==='s0t24') comboU('s0t24','ps0t24',7800,'pico24-liq');
    else if(id==='s0t34') comboU('s0t34','ps0t34',null,'pico34-liq','pico34-base');
    else if(id==='s0t25') comboU('s0t25','ps0t25',null,'pico25-liq','pico25-base');
    else if(id==='s0t26') comboU('s0t26','ps0t26',11520,'pico26-liq');
    else{
      if(id==='s1t31') qtySelU('s1t31','ps1t31','sel-s1t31','q-s1t31');
      else if(staticPrices[id]!==undefined){const _el=document.getElementById(id);P[id]=_el&&_el.dataset.currentPrice?parseInt(_el.dataset.currentPrice):staticPrices[id];O[id]='';}
      else{
        const sel=el.querySelector('.os');
        if(sel){P[id]=parseInt(sel.value)||0;O[id]=sel.options[sel.selectedIndex]?.text||'';}
        else{
          const numInp = el.querySelector('input[type="number"][id^="q-"]');
          if(numInp){
            const pdEl = el.querySelector('.pd');
            if(pdEl?.id) qtyU(id, pdEl.id, unitPrices[id] || 0, numInp.id);
          } else {
            const pd=el.querySelector('.pd');
            if(pd){const t=pd.textContent.replace(/[¥,\s]/g,'').replace('—','');P[id]=parseInt(t)||0;}
          }
        }
      }
    }
  }
  upd();
  // 勾選/取消後刷新 select 型與 buddy 型群組
  Object.entries(groupDeals).forEach(([gid, g]) => {
    if (g.type === 'select' && g.items[id]) refreshSelectGroup(gid);
    if (dealModeOn && g.type === 'buddy' && (g.primary.id === id || g.buddies.includes(id))) refreshBuddyGroup(gid);
  });
}

function delFromM(id){
  C.delete(id);
  delete P[id];
  delete O[id];
  const el=document.getElementById(id);
  if(el) el.classList.remove('on');
  upd();

  // unit 群組
  if (dealModeOn) {
    Object.entries(groupDeals).forEach(([gid, group]) => {
      if (group.type === 'unit' && group.items[id]) {
        setPD('p' + id, group.items[id].normalUnit);
        refreshUnitGroup(gid);
      }
      if (group.type === 'buddy' && (group.primary.id === id || group.buddies.includes(id))) {
        refreshBuddyGroup(gid);
      }
    });
  }
  // select 群組
  Object.keys(groupDeals).forEach(gid => {
    if (groupDeals[gid].type === 'select' && groupDeals[gid].items[id]) refreshSelectGroup(gid);
  });
  // extra 同時優惠群組
  refreshExtraGroups();

  if(C.size===0){closeM();}
  else{openM();}
}

function openM(){
  const body=document.getElementById('mbody');
  const totEl=document.getElementById('mtot');
  if(C.size===0){body.innerHTML='<div class="memp">尚未選擇任何療程</div>';totEl.textContent='0';return;}
  let html='',sum=0;
  for(const id of C){
    const el=document.getElementById(id);
    const name=el?el.dataset.name||(el.querySelector('.tn')?.textContent?.trim()||id):id;
    const opt=O[id]||'';
    const p=P[id]||0;sum+=p;
    html+='<div class="mrow">'
      +'<div class="mrow-info"><div class="mn">'+name+'</div><div class="mo">'+opt+'</div></div>'
      +'<div class="mrow-right"><div class="mp">¥'+p.toLocaleString()+'</div>'
      +'<button class="mdel" onclick="delFromM(\''+id+'\')" title="刪除">✕</button></div>'
      +'</div>';
  }
  body.innerHTML=html;
  totEl.textContent=sum.toLocaleString();
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeM(){document.getElementById('ov').classList.remove('open');document.body.style.overflow='';}

function sw(i,btn){
  document.querySelectorAll('.sp').forEach((p,j)=>p.classList.toggle('on',j===i));
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function resetAll(){
  C.clear();
  Object.keys(P).forEach(k=>delete P[k]);
  Object.keys(O).forEach(k=>delete O[k]);
  document.querySelectorAll('.ti').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.os').forEach(sel=>{sel.selectedIndex=0;});
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('[id^="pg-t-extra-item-"]').forEach(g=>g.querySelector('.pill')?.classList.add('active'));
  [{g:'pg-s0t21-t',i:0},{g:'pg-s0t22-t',i:0},{g:'pg-s0t31-time',i:0},{g:'pg-s0t31b-time',i:0},{g:'pg-s1t41-time',i:0},{g:'pg-s1t58-time',i:0},{g:'pg-s1t58-upg',i:0}].forEach(({g,i})=>{const el=document.getElementById(g);if(el)el.querySelectorAll('.pill')[i]?.classList.add('active');});
  const mFace=document.getElementById('pg-s0t31-face');if(mFace)mFace.querySelectorAll('.pill')[2]?.classList.add('active');
  const mEye=document.getElementById('pg-s0t31-eye');if(mEye)mEye.querySelector('.pill')?.classList.add('active');
  const s2t6T=document.getElementById('pg-s2t6-time');if(s2t6T)s2t6T.querySelector('.pill')?.classList.add('active');
  ['kr-base','kr-extra','bt-base','bt-extra'].forEach(id=>{const el=document.getElementById(id);if(el)el.selectedIndex=0;});
  const jg=document.getElementById('jalupro26-glow');if(jg)jg.selectedIndex=0;
  const aa=document.getElementById('an-areas');if(aa)aa.value=1;
  const ah=document.getElementById('an-hint');if(ah)ah.textContent='1部位 × ¥980 = ¥980';
  ['s1t44-cc','s1t46-cc'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=1;});
  const bh=document.getElementById('bnls-hint');if(bh){bh.textContent='1cc × ¥'+rates.bnls.r1.toLocaleString()+'/cc = ¥'+rates.bnls.r1.toLocaleString()+'　｜　1〜9cc：¥'+rates.bnls.r1.toLocaleString()+'　10cc以上：¥'+rates.bnls.r2.toLocaleString();bh.style.color='';}
  const fh=document.getElementById('fatx-hint');if(fh){fh.textContent='1cc × ¥'+rates.fatx.r1.toLocaleString()+'/cc = ¥'+rates.fatx.r1.toLocaleString()+'　｜　1〜4cc：¥'+rates.fatx.r1.toLocaleString()+'　5〜9cc：¥'+rates.fatx.r2.toLocaleString()+'　10cc以上：¥'+rates.fatx.r3.toLocaleString();fh.style.color='';}
  document.querySelectorAll('input.ci[id^="q-"]').forEach(el=>{el.value=1;});
  ['sel-s1t31'].forEach(id=>{const el=document.getElementById(id);if(el)el.selectedIndex=0;});
  ['pico24-liq','pico34-base','pico34-liq','pico25-base','pico25-liq','pico26-liq','dp40-base','dp40-liq','dp41-liq'].forEach(id=>{const el=document.getElementById(id);if(el)el.selectedIndex=0;});
  mrfU();upd();

  // 分院篩選一併重設
  const csel=document.getElementById('clinic-sel');
  if(csel) csel.value='all';
  currentClinic='all';
  applyClinicFilter();
}


/* ══════════════════════════════════════════════════════════════
   9. 啟動
   ══════════════════════════════════════════════════════════════ */
initHeaderControls();
fixTabsTop();
fetchRate();
loadSheetPrices();
</script>
